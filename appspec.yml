version: 0.0
os: linux
files:
  - source: /
    destination: /opt/student-app
file_exists_behavior: OVERWRITE
hooks:
  BeforeInstall:
    - location: scripts/install_dependencies.sh
      timeout: 600
      runas: root
  AfterInstall:
    - location: scripts/stop_container.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: scripts/start_container.sh
      timeout: 600
      runas: root
