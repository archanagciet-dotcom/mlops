
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Predictor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            color: #2563eb;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 12px;
            background: #dcfce7;
            text-align: center;
            font-weight: bold;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Student Result Predictor</h1>

        <p style="text-align:center">
            Model Version: {{ model_version }}
        </p>

        <form method="POST">
            <label>Study Hours per Day</label>
            <input type="number" name="hours"
                   min="0" max="24" step="0.1" required>

            <label>Attendance Percentage</label>
            <input type="number" name="attendance"
                   min="0" max="100" step="0.1" required>

            <label>Internal Marks (out of 50)</label>
            <input type="number" name="marks"
                   min="0" max="50" step="0.1" required>

            <button type="submit">Predict Result</button>
        </form>

        {% if prediction %}
            <div class="result">
                Predicted Result: {{ prediction }}
            </div>
        {% endif %}

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
